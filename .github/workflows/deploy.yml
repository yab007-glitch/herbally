name: Deploy

# Deploys to the self-hosted runner on the laptop (WSL). The repo is public,
# so this workflow must never run for pull_request events: only a successful
# CI run for a push to main, or a manual dispatch, may execute on that host.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, herbally]
    timeout-minutes: 45
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Save the current image for rollback
        run: |
          set -euo pipefail
          if docker image inspect herbally-app:local >/dev/null 2>&1; then
            docker tag herbally-app:local herbally-app:rollback
            echo "saved herbally-app:rollback"
          else
            echo "no existing image"
          fi

      - name: Sync source into the deploy directory
        run: |
          set -euo pipefail
          # deploy/ is excluded on purpose: it holds production secrets and
          # stack config that must not be overwritten by a code push.
          #
          # --delete matters: without it, a source file deleted in the repo
          # stays in /srv/herbally and is rebuilt into every image. That is
          # how the removed [locale]/[...rest] catch-all survived a deploy
          # and kept the 404 page broken. Excluded paths (deploy/, backups/,
          # artifacts/, .git, node_modules, .next) are protected from
          # deletion as well, so the secrets and the local-only harvest
          # caches are safe.
          rsync -a --delete \
            --exclude .git \
            --exclude deploy/ \
            --exclude node_modules \
            --exclude .next \
            --exclude backups/ \
            --exclude artifacts/ \
            "$GITHUB_WORKSPACE/" /srv/herbally/

      - name: Build image
        working-directory: /srv/herbally/deploy
        run: |
          set -euo pipefail
          BUILD_TS=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%cI || date -u +%Y-%m-%dT%H:%M:%SZ)
          docker compose build --build-arg BUILD_GIT_TIMESTAMP="$BUILD_TS" app

      - name: Deploy
        working-directory: /srv/herbally/deploy
        run: |
          set -euo pipefail
          # Wipe stale Next.js Data/Fetch Cache across upgrades while keeping
          # optimized next/image files, and force-recreate the app container
          # so /app/.next/server/route-cache in the writable layer is fresh.
          rm -rf /var/lib/docker/volumes/herbally_next-cache/_data/fetch-cache/* 2>/dev/null || true
          docker compose up -d --force-recreate --no-deps app

      - name: Wait for health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' herbally-app 2>/dev/null || echo missing)
            if [ "$status" = "healthy" ]; then
              echo "healthy after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "app did not become healthy"
          docker logs herbally-app --tail 60
          exit 1

      - name: Smoke test the public site
        run: |
          set -euo pipefail
          home=$(curl -fsS -o /dev/null -w '%{http_code}' https://herbally.app/)
          api=$(curl -fsS -o /dev/null -w '%{http_code}' 'https://herbally.app/api/interactions/check?herb=ginger&drug=warfarin')
          sitemap=$(curl -fsS https://herbally.app/sitemap.xml)
          locs=$(printf '%s' "$sitemap" | grep -c '<loc>' || true)
          echo "home=$home api=$api sitemap_urls=$locs"
          # The sitemap is deliberately small: only herb pages with a curated
          # monograph or curated drug interaction are offered, keeping thin
          # regulatory-only stubs out of search. Floor of 1,000 catches an empty
          # or truncated sitemap without failing on the tightened index.
          [ "$home" = "200" ] && [ "$api" = "200" ] && [ "$locs" -ge 1000 ]
          # Assert a known sourced page is offered, by shell case rather than
          # `curl | grep -q`: grep closes the pipe on first match, curl exits 23
          # ("failure writing output") and `set -o pipefail` fails a healthy site.
          case "$sitemap" in
            *"/herbs/aloe-vera<"*) echo "sourced herb page present" ;;
            *) echo "sourced herb page missing from sitemap"; exit 1 ;;
          esac

          # Best-effort IndexNow notification for Bing/DuckDuckGo/ChatGPT Search
          idx_key=$(tr -d '\r\n' < /srv/herbally/public/indexnow-key.txt 2>/dev/null || true)
          if [ -n "$idx_key" ]; then
            curl -fsS -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"host\":\"herbally.app\",\"key\":\"${idx_key}\",\"keyLocation\":\"https://herbally.app/${idx_key}.txt\",\"urlList\":[\"https://herbally.app/\",\"https://herbally.app/herbs\",\"https://herbally.app/medications\",\"https://herbally.app/herb-drug-interactions\",\"https://herbally.app/surgery-planner\",\"https://herbally.app/npn-checker\",\"https://herbally.app/guides\",\"https://herbally.app/compare\",\"https://herbally.app/fr\",\"https://herbally.app/fr/medications\",\"https://herbally.app/fr/surgery-planner\",\"https://herbally.app/fr/guides\",\"https://herbally.app/rss.xml\"]}" >/dev/null || true
            echo "IndexNow pinged"
          fi

      - name: Prune stale Docker images and build cache
        run: |
          set -euo pipefail
          # Keep herbally-app:rollback and recent layers so deploys stay fast
          # while preventing multi-gigabyte build cache bloat on C:.
          docker image prune -f --filter "until=48h" || true
          docker builder prune -f --keep-storage=4GB || true

      - name: Roll back on failure
        if: failure()
        run: |
          set -euo pipefail
          echo "deploy failed; restoring the previous image"
          if docker image inspect herbally-app:rollback >/dev/null 2>&1; then
            docker tag herbally-app:rollback herbally-app:local
            (cd /srv/herbally/deploy && docker compose up -d app) || true
          fi
