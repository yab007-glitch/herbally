name: Deploy

# Deploys to the self-hosted runner on the laptop (WSL). The repo is public,
# so this workflow must never run for pull_request events: only a successful
# CI run for a push to main, or a manual dispatch, may execute on that host.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, herbally]
    timeout-minutes: 45
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect runtime and schema changes
        id: changes
        run: |
          set -euo pipefail
          PREV_SHA=""
          if [ -f /srv/herbally/.last-deployed-sha ]; then
            PREV_SHA="$(tr -d '\r\n' < /srv/herbally/.last-deployed-sha)"
          fi
          echo "previous_sha=${PREV_SHA:-<none>}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$PREV_SHA" ] || ! git cat-file -e "$PREV_SHA^{commit}" 2>/dev/null; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            echo "migrations_changed=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$PREV_SHA" HEAD)"
          echo "Changed files since $PREV_SHA:"
          echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            echo "No changed files since $PREV_SHA; skipping container rebuild."
          elif printf '%s\n' "$CHANGED" | sed '/^$/d' | grep -qvE '^(docs/|artifacts/|e2e/|\.github/workflows/uptime-watch\.yml|[^/]+\.md$)'; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/artifacts/non-runtime files changed; skipping container rebuild."
          fi
          if printf '%s\n' "$CHANGED" | grep -qE '^supabase/migrations/'; then
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::New SQL files exist under supabase/migrations/ since $PREV_SHA. Verify database migrations are applied and rollback compatibility is checked."
          else
            echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the current image for rollback
        if: steps.changes.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          if docker image inspect herbally-app:local >/dev/null 2>&1; then
            docker tag herbally-app:local herbally-app:rollback
            echo "saved herbally-app:rollback"
          else
            echo "no existing image"
          fi

      - name: Sync source into the deploy directory
        if: steps.changes.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          # deploy/ is excluded on purpose: it holds production secrets and
          # stack config that must not be overwritten by a code push.
          rsync -a --delete \
            --exclude .git \
            --exclude deploy/ \
            --exclude node_modules \
            --exclude .next \
            --exclude backups/ \
            --exclude artifacts/ \
            --exclude .last-deployed-sha \
            "$GITHUB_WORKSPACE/" /srv/herbally/

      - name: Apply & verify expand-phase SQL migrations (00097–00111, excluding 00104) fail-closed before app switch
        if: steps.changes.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          if bash /srv/herbally/scripts/apply-pending-migrations.sh --phase expand --verify-only; then
            echo "Expand migrations (00097–00111, excluding 00104) already verified in herbally-db."
          else
            echo "Pending expand migrations (00097–00111) not yet verified; running backup + expand runner..."
            BACKUP_SCRIPT="$GITHUB_WORKSPACE/deploy/backup-local.sh"
            if [ -f /srv/herbally/deploy/backup-local.sh ]; then
              BACKUP_SCRIPT="/srv/herbally/deploy/backup-local.sh"
            fi
            BACKUP_SCRIPT="$BACKUP_SCRIPT" bash /srv/herbally/scripts/apply-pending-migrations.sh --phase expand
          fi

      - name: Build image
        if: steps.changes.outputs.deploy_needed == 'true'
        working-directory: /srv/herbally/deploy
        run: |
          set -euo pipefail
          BUILD_TS=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%cI || date -u +%Y-%m-%dT%H:%M:%SZ)
          docker compose build --build-arg BUILD_GIT_TIMESTAMP="$BUILD_TS" app

      - name: Deploy
        if: steps.changes.outputs.deploy_needed == 'true'
        working-directory: /srv/herbally/deploy
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_SESSION_SECRET: ${{ secrets.LINKEDIN_SESSION_SECRET }}
        run: |
          set -euo pipefail
          docker exec -u 0 herbally-app sh -c 'rm -rf /app/.next/cache/fetch-cache/*' 2>/dev/null || true
          OVERRIDE_FILE=""
          cleanup_override() {
            if [ -n "$OVERRIDE_FILE" ]; then
              rm -f "$OVERRIDE_FILE"
            fi
          }
          trap cleanup_override EXIT

          KEYS=()
          for k in LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET LINKEDIN_SESSION_SECRET; do
            if [ -n "${!k:-}" ]; then
              KEYS+=("$k")
            fi
          done

          if [ "${#KEYS[@]}" -gt 0 ]; then
            OVERRIDE_FILE="${RUNNER_TEMP}/linkedin-oauth.override.yml"
            {
              echo "services:"
              echo "  app:"
              echo "    environment:"
              for k in "${KEYS[@]}"; do
                echo "      - ${k}"
              done
            } > "$OVERRIDE_FILE"
            echo "Injecting optional LinkedIn OAuth env keys via compose override: ${KEYS[*]}"
            docker compose --project-directory /srv/herbally/deploy -f docker-compose.yml -f "$OVERRIDE_FILE" up -d --force-recreate --no-deps app
          else
            docker compose up -d --force-recreate --no-deps app
          fi

      - name: Wait for health
        if: steps.changes.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' herbally-app 2>/dev/null || echo missing)
            if [ "$status" = "healthy" ]; then
              echo "healthy after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "app did not become healthy"
          docker logs herbally-app --tail 60
          exit 1

      - name: Smoke test the public site (pre-contract)
        if: steps.changes.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          for path in "/" "/herbs" "/herbs/aloe-vera" "/calculator?herb=ginger"; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "https://herbally.app${path}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ]
          done

          ix_json=$(curl -fsS 'https://herbally.app/api/interactions/check?herb=ginger&drug=warfarin')
          printf '%s' "$ix_json" | grep -q '"found":true'

          search_json=$(curl -fsS 'https://herbally.app/api/herbs/search?q=ginger')
          printf '%s' "$search_json" | grep -qi 'ginger'

          sitemap=$(curl -fsS https://herbally.app/sitemap.xml)
          locs=$(printf '%s' "$sitemap" | grep -c '<loc>' || true)
          echo "sitemap_urls=$locs"
          [ "$locs" -ge 1000 ]
          case "$sitemap" in
            *"/herbs/aloe-vera<"*) echo "sourced herb page present" ;;
            *) echo "sourced herb page missing from sitemap"; exit 1 ;;
          esac

      - name: Apply & verify post-switch contract migration (00104) & verify public site + admin CRUD
        if: steps.changes.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          if bash /srv/herbally/scripts/apply-pending-migrations.sh --phase contract --verify-only; then
            echo "Contract 00104 already enforced and verified in herbally-db."
          else
            echo "Applying post-switch 00104 pediatric boundary & dosage_calculations contract..."
            bash /srv/herbally/scripts/apply-pending-migrations.sh --phase contract
          fi

          # Verify full expand + contract postconditions together
          bash /srv/herbally/scripts/apply-pending-migrations.sh --phase all --verify-only

          # Verify post-contract service_role admin CRUD RETURNING compatibility (rolled back cleanly)
          docker exec -i herbally-db psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE service_role;
          INSERT INTO public.herbs (name, slug, scientific_name, description, dosage_adult, is_published)
          VALUES ('Deploy Smoke Herb', 'deploy-smoke-herb-check', 'Smoke botanical', 'Smoke check.', '100 mg', false)
          RETURNING id, slug, name, description, dosage_adult;
          UPDATE public.herbs
          SET description = 'Updated smoke check.'
          WHERE slug = 'deploy-smoke-herb-check'
          RETURNING id, slug, description;
          ROLLBACK;
          SQL

          # Re-run full public smoke post-00104
          for path in "/" "/herbs" "/herbs/aloe-vera" "/calculator?herb=ginger" "/trust" "/embed.js" "/open-data/manifest.json" "/open-data/privacy-manifest.json" "/open-data/review-queue.json" "/open-data/v3-15-0.json"; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "https://herbally.app${path}")
            echo "post-contract ${path} -> ${code}"
            [ "$code" = "200" ]
          done
          curl -fsS 'https://herbally.app/api/interactions/check?herb=ginger&drug=warfarin' | grep -q '"found":true'
          curl -fsS 'https://herbally.app/api/herbs/search?q=ginger' | grep -qi 'ginger'

          # Publish audit-verifiable migration & smoke summary without shell backtick expansion
          DEPLOYED_SHA="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              printf '### Production Deploy & Migration Verification\n'
              printf -- '- **Deployed SHA**: `%s`\n' "$DEPLOYED_SHA"
              printf -- '- **Expand migrations verified (`--phase expand`)**: `00097–00111` (excluding `00104`)\n'
              printf -- '- **Contract migration verified (`--phase contract`)**: `00104_pediatric_boundary_contract.sql`\n'
              printf -- '- **Post-switch smoke & Open Data checks**: PASS\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Record deployed SHA only after post-contract smoke passes
          printf '%s\n' "$DEPLOYED_SHA" > /srv/herbally/.last-deployed-sha

          # Best-effort IndexNow notification for Bing/DuckDuckGo/ChatGPT Search
          idx_key=$(tr -d '\r\n' < /srv/herbally/public/indexnow-key.txt 2>/dev/null || true)
          if [ -n "$idx_key" ]; then
            curl -fsS -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"host\":\"herbally.app\",\"key\":\"${idx_key}\",\"keyLocation\":\"https://herbally.app/${idx_key}.txt\",\"urlList\":[\"https://herbally.app/\",\"https://herbally.app/llms.txt\",\"https://herbally.app/llms-full.txt\",\"https://herbally.app/herbs\",\"https://herbally.app/herbs/turmeric\",\"https://herbally.app/herbs/ginger\",\"https://herbally.app/herbs/abrus-precatorius\",\"https://herbally.app/compare/turmeric/vs/ginger\",\"https://herbally.app/medications\",\"https://herbally.app/medications/rivaroxaban\",\"https://herbally.app/medications/dabigatran\",\"https://herbally.app/medications/edoxaban\",\"https://herbally.app/herb-drug-interactions\",\"https://herbally.app/interactions/ginger/warfarin\",\"https://herbally.app/surgery-planner\",\"https://herbally.app/npn-checker\",\"https://herbally.app/calculator\",\"https://herbally.app/guides\",\"https://herbally.app/guides/how-the-dosage-calculator-works\",\"https://herbally.app/compare\",\"https://herbally.app/methodology\",\"https://herbally.app/privacy\",\"https://herbally.app/trust\",\"https://herbally.app/widgets\",\"https://herbally.app/clinical-review\",\"https://herbally.app/about\",\"https://herbally.app/sponsors\",\"https://herbally.app/fr\",\"https://herbally.app/fr/herbs/turmeric\",\"https://herbally.app/fr/medications\",\"https://herbally.app/fr/surgery-planner\",\"https://herbally.app/fr/guides\",\"https://herbally.app/fr/methodology\",\"https://herbally.app/fr/privacy\",\"https://herbally.app/fr/trust\",\"https://herbally.app/rss.xml\"]}" >/dev/null || true
            echo "IndexNow pinged"
          fi

      - name: Prune stale Docker images and build cache
        if: steps.changes.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          docker image prune -f --filter "until=48h" || true
          docker builder prune -f --keep-storage=4GB || true

      - name: Roll back on failure
        if: failure() && steps.changes.outputs.deploy_needed == 'true'
        run: |
          set -euo pipefail
          echo "Deploy failed; checking whether 00104 contract state was applied before restoring old image..."
          CONTRACT_APPLIED="$(docker exec -i herbally-db psql -U postgres -d postgres -tAc "
            SELECT CASE WHEN
              NOT has_column_privilege('anon', 'public.herbs', 'dosage_adult', 'SELECT')
              OR NOT has_column_privilege('anon', 'public.herbs', 'dosage_child', 'SELECT')
              OR EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'dosage_calculations_adult_only_check')
            THEN 'yes' ELSE 'no' END;
          ")"
          if [ "$CONTRACT_APPLIED" = "yes" ]; then
            echo "00104 contract detected; executing verified rollback-00104-contract.sql BEFORE old-image restoration..."
            bash /srv/herbally/scripts/apply-pending-migrations.sh --rollback-contract
          else
            echo "00104 contract not applied; base-table grants and pre-contract writes remain open."
          fi

          if docker image inspect herbally-app:rollback >/dev/null 2>&1; then
            echo "Restoring herbally-app:rollback image..."
            docker tag herbally-app:rollback herbally-app:local
            (cd /srv/herbally/deploy && docker compose up -d --force-recreate --no-deps app)
          else
            echo "ERROR: herbally-app:rollback image missing; manual container recovery required." >&2
            exit 1
          fi
