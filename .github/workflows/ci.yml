name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: ./scripts/detect-secrets.sh --all

  supply-chain-audit:
    name: Production Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Check production dependencies for high/critical advisories
        run: npm audit --omit=dev --audit-level=high

  verify-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static lint of SQL migration files
        run: npx tsx scripts/verify-herb-database.ts --migrations-only

  targeted-migration-fixture:
    name: Targeted PG16 Migration Fixture (00097–00111)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: herbally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d herbally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: herbally_test
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run targeted PG16 fixture (expand -> old-image compat -> contract -> assertions)
        run: bash scripts/test-migrations-postgres.sh

  full-migration-replay:
    name: Full Migration Replay (00001–00111)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: herbally_replay
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d herbally_replay"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: herbally_replay
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay full migration chain from 00001
        run: bash scripts/test-full-migration-replay.sh

  backup-restore-drill:
    name: PG16 Backup & Restore Drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: herbally_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d herbally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5434"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: herbally_test
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run non-destructive pg_dump -Fc -> pg_restore -> RLS integration drill
        env:
          PG_BIN_IMAGE: postgres:16
        run: bash scripts/test-backup-restore-drill.sh

  verify-db:
    runs-on: ubuntu-latest
    env:
      VERIFY_DB_SUPABASE_URL: ${{ secrets.VERIFY_DB_SUPABASE_URL }}
      VERIFY_DB_SUPABASE_ANON_KEY: ${{ secrets.VERIFY_DB_SUPABASE_ANON_KEY }}
      REQUIRE_LIVE_VERIFY_DB: ${{ vars.REQUIRE_LIVE_VERIFY_DB }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify live herb database integrity
        run: |
          if [ -n "$VERIFY_DB_SUPABASE_URL" ] && [ -n "$VERIFY_DB_SUPABASE_ANON_KEY" ]; then
            npx tsx scripts/verify-herb-database.ts --ci --production-only
          elif [ "$REQUIRE_LIVE_VERIFY_DB" = "true" ]; then
            npx tsx scripts/verify-herb-database.ts --ci --production-only
          else
            echo "::warning::Live verify-db skipped: VERIFY_DB_SUPABASE_URL/KEY secrets are not configured and REQUIRE_LIVE_VERIFY_DB is not 'true'. Only verify-migrations ran."
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox]
    # Placeholder Supabase env so the standalone server's proxy (updateSession)
    # can construct a client and start. AI provider keys are intentionally unset
    # so E2E_NO_AI_KEY=1 proves deterministic refusals return 200 before 503.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      E2E_NO_AI_KEY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.project }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install Playwright browser (${{ matrix.project }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
      - name: Upload WCAG 2.2 AA accessibility audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-audit-report-${{ matrix.project }}
          path: test-results/accessibility-audit-report.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

  postgrest-and-migrated-e2e:
    name: PostgREST Smoke & Migrated-DB E2E (post-00104/00111)
    needs: [targeted-migration-fixture]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: herbally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d herbally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: herbally_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrate & verify PG16 database through 00111 (incl. 00104 contract)
        run: bash scripts/test-migrations-postgres.sh
      - name: Start PostgREST and run real PostgREST smoke suite
        run: |
          set -euo pipefail
          JWT_KEY="ci-postgrest-test-signing-key-32bytes"
          export PGRST_JWT_SECRET="$JWT_KEY"
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgresql://postgres:postgres@127.0.0.1:5432/herbally_test" \
            -e PGRST_DB_SCHEMAS="public" \
            -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_JWT_SECRET="$JWT_KEY" \
            -e PGRST_SERVER_PORT="3001" \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          POSTGREST_URL=http://127.0.0.1:3001 bash scripts/test-postgrest-smoke.sh
      - name: Build & run migrated-DB Playwright E2E (with no AI key)
        run: |
          set -euo pipefail
          JWT_KEY="ci-postgrest-test-signing-key-32bytes"
          mint_jwt() {
            node -e '
              const crypto = require("node:crypto");
              const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
              const h = b64({ alg: "HS256", typ: "JWT" });
              const now = Math.floor(Date.now() / 1000);
              const p = b64({ role: process.argv[2], iss: "herbally-ci", iat: now, exp: now + 3600 });
              const s = crypto.createHmac("sha256", process.argv[1]).update(h + "." + p).digest("base64url");
              process.stdout.write(h + "." + p + "." + s);
            ' "$JWT_KEY" "$1"
          }
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(mint_jwt anon)"
          export SUPABASE_SERVICE_ROLE_KEY="$(mint_jwt service_role)"
          node scripts/postgrest-supabase-proxy.mjs &
          PROXY_PID=$!
          trap 'kill $PROXY_PID ${NEXT_PID:-} >/dev/null 2>&1 || true' EXIT
          npm run build
          cp -r .next/static/. .next/standalone/.next/static/
          cp -r public/. .next/standalone/public/
          PORT=3100 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          NEXT_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          npx playwright install --with-deps chromium
          # Seed clinical & toxic-botanical fixture rows so the full 22-check
          # WCAG 2.2 AA matrix (including quarantine & dynamic clinical routes)
          # runs on every PR and main CI build.
          psql "postgresql://postgres:postgres@127.0.0.1:5432/herbally_test" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.herbs (
            id, name, slug, scientific_name, description, dosage_adult,
            category_id, is_published, contraindications, translations
          ) VALUES
          (
            '33333333-3333-3333-3333-333333333341',
            'Rosary Pea',
            'abrus-precatorius',
            'Abrus precatorius',
            'Permanently quarantined poisonous botanical containing abrin.',
            NULL,
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1',
            true,
            ARRAY['Lethal abrin toxin — strictly prohibited for human use'],
            '{"fr":{"name":"Pois rouge","description":"Plante toxique en quarantaine permanente contenant de l''abrine."}}'::jsonb
          ),
          (
            '33333333-3333-3333-3333-333333333342',
            'Turmeric',
            'turmeric',
            'Curcuma longa',
            'Curcuminoid-containing rhizome widely studied for inflammation.',
            '500 mg standardized curcuminoids twice daily',
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1',
            true,
            ARRAY['Gallstones or bile duct obstruction', 'Pre-surgery (stop 2 weeks before)'],
            '{"fr":{"name":"Curcuma","description":"Rhizome riche en curcuminoïdes."}}'::jsonb
          ),
          (
            '33333333-3333-3333-3333-333333333343',
            'St. John''s Wort',
            'st-johns-wort',
            'Hypericum perforatum',
            'Botanical antidepressant and potent CYP3A4 / P-gp inducer.',
            '300 mg standardized extract three times daily',
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1',
            true,
            ARRAY['Extensive CYP3A4 and P-gp drug interactions'],
            '{"fr":{"name":"Millepertuis","description":"Inducteur puissant du CYP3A4 et de la P-gp."}}'::jsonb
          )
          ON CONFLICT (slug) DO NOTHING;

          INSERT INTO public.drug_interactions (
            id, herb_id, drug_name, severity, description, mechanism,
            evidence_level, source, source_url
          ) VALUES (
            '44444444-4444-4444-4444-444444444445',
            '33333333-3333-3333-3333-333333333343',
            'Rivaroxaban',
            'severe',
            'Reduces rivaroxaban plasma exposure via CYP3A4 and P-gp induction.',
            'Potent induction of CYP3A4 and P-glycoprotein.',
            'well-documented',
            'PubMed PMID:32478963',
            'https://pubmed.ncbi.nlm.nih.gov/32478963/'
          )
          ON CONFLICT (id) DO NOTHING;
          SQL
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 E2E_MIGRATED_DB=1 E2E_NO_AI_KEY=1 \
            npx playwright test e2e/migrated-db.spec.ts e2e/calculator.spec.ts --project=chromium
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 E2E_INCLUDE_CLINICAL_ROUTES=1 \
            npx playwright test e2e/ux-accessibility-audit.spec.ts --project=chromium
          npx tsx scripts/pentest-suite.ts --base-url http://127.0.0.1:3100
      - name: Upload clinical + toxic-quarantine WCAG 2.2 AA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-audit-report-clinical-chromium
          path: test-results/accessibility-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        test,
        coverage,
        format,
        verify-migrations,
        targeted-migration-fixture,
        full-migration-replay,
        backup-restore-drill,
        postgrest-and-migrated-e2e,
        verify-db,
        secrets,
        supply-chain-audit,
      ]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      OPENROUTER_API_KEY: placeholder
      SENTRY_ORG: placeholder
      SENTRY_PROJECT: placeholder
      SENTRY_AUTH_TOKEN: placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
