version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      supabase:
        patterns: ["@supabase/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      testing:
        patterns:
          [
            "vitest",
            "@vitest/*",
            "@testing-library/*",
            "playwright",
            "@playwright/*",
          ]
    ignore:
      # Major bumps reviewed manually (see audit notes for openai 4->6, react-markdown 9->10)
      - dependency-name: "openai"
        update-types: ["major"]
      - dependency-name: "react-markdown"
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
