<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — HerbAlly</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      margin: 0;
      background: #fafafa;
      color: #1a1a1a;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { color: #666; font-size: 0.95rem; line-height: 1.5; margin: 0; }
    .cached { margin-top: 1.5rem; font-size: 0.8rem; color: #999; }
    a { color: #16a34a; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🌿</div>
    <h1>You're offline</h1>
    <p>HerbAlly works offline too. Previously viewed herb pages are available from cache.</p>
    <p class="cached">
      <a href="/herbs">Browse cached herbs</a> · <a href="/">Go home</a>
    </p>
  </div>
</body>
</html>
