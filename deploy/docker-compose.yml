# HerbAlly — self-hosted stack.
#
# Trimmed from the official supabase/docker compose. Deliberately dropped:
#   studio, meta, realtime, storage, imgproxy, functions, supavisor,
#   logflare/vector. None of them are used by the app (0 storage calls,
#   0 realtime channels, no edge functions, ~18 req/min of API traffic).
#
# Also dropped: the Envoy api-gw. The hosted project's keys are opaque
# `sb_publishable_…`/`sb_secret_…` values that PostgREST cannot consume, which
# is why the upstream stack needs a gateway. Here we mint our own classic HS256
# JWTs (deploy/gen-keys.mjs), so PostgREST and GoTrue take them directly and
# Caddy does the /rest/v1 and /auth/v1 path routing the gateway used to do.
# One less container, one less config language to keep correct.

name: herbally

# Resource ceilings. The box is 8 GB / 2 vCPU and the app is rebuilt in place
# on it, so an unbounded `next build` (~2–3 GB) beside a live Postgres lets the
# kernel choose the OOM victim — often Postgres. db gets 3g because the tuned
# shared_buffers is 1–2 GB, plus connections and per-connection work_mem. Total
# ceiling is ≈5.6 GB of 8 GB, leaving headroom for the build and page cache.
services:
  db:
    image: supabase/postgres:17.6.1.136
    container_name: herbally-db
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    # Docker's 10 s default SIGKILLs a checkpointing Postgres. A fast shutdown
    # normally finishes well inside a minute.
    stop_grace_period: 60s
    shm_size: 1gb
    volumes:
      # These two run only on a fresh PGDATA. They set the passwords of the
      # roles the image already creates, and the database-level JWT expiry.
      - ./supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      # Holds the pgsodium root key; must survive container recreation.
      - db-config:/etc/postgresql-custom
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      # The supabase image preloads 12 extensions and runs init scripts; a
      # restore-plus-init can exceed 100 s on slow storage. rest/auth gate on
      # service_healthy, so a short budget aborts the whole stack mid-startup.
      retries: 60
      start_period: 120s
    networks:
      - dbnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot. Puts the `auth` schema in a state GoTrue can migrate into, and
  # is deliberately a service rather than an init script: init scripts only
  # run on an empty PGDATA, and a half-initialised volume would then be
  # permanently broken with no obvious cause. Idempotent, so it is harmless on
  # every `docker compose up`.
  db-init:
    image: supabase/postgres:17.6.1.136
    container_name: herbally-db-init
    restart: "no"
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - ./supabase/volumes/db/auth-schema-ownership.sql:/sql/auth-schema-ownership.sql:ro
    command:
      - psql
      - -h
      - db
      - -U
      - postgres
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /sql/auth-schema-ownership.sql
    networks:
      - dbnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rest:
    image: postgrest/postgrest:v14.18
    container_name: herbally-rest
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      # Needed by the healthcheck: `postgrest --ready` probes the admin server.
      PGRST_ADMIN_SERVER_HOST: "localhost"
      PGRST_ADMIN_SERVER_PORT: "3001"
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api
      - dbnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth:
    image: supabase/gotrue:v2.197.0
    container_name: herbally-auth
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://api.herbally.app/auth/v1

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: https://herbally.app
      # Locale-prefixed auth callbacks (/en/auth/callback, /fr/auth/callback).
      GOTRUE_URI_ALLOW_LIST: https://herbally.app/auth/callback,https://herbally.app/en/auth/callback,https://herbally.app/fr/auth/callback

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ISSUER: https://api.herbally.app/auth/v1

      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

      # Zoho Mail — same mailbox the hosted project uses for transactional mail.
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      # Defaulted rather than required: GoTrue fails to boot on an empty int,
      # so an unfilled .env would crash-loop instead of reporting a mail error.
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-HerbAlly}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api
      - dbnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      network: host
      # The build reads the database (sitemap, symptom hubs) through
      # NEXT_PUBLIC_SUPABASE_URL, which is also baked into the client bundle and
      # therefore cannot be a docker-internal name. Without this mapping the
      # build resolves api.herbally.app on the public internet — before cutover
      # that is Vercel, which answers DEPLOYMENT_NOT_FOUND, and the sitemap then
      # silently prerenders with zero herb URLs.
      extra_hosts:
        - "api.herbally.app:127.0.0.1"
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time, so
        # these must match the runtime values exactly.
        NEXT_PUBLIC_SUPABASE_URL: http://api.herbally.app
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?run deploy/gen-keys.mjs first}
        NEXT_PUBLIC_APP_URL: https://herbally.app
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-HerbWise}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    image: ${APP_IMAGE:-herbally-app:local}
    container_name: herbally-app
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5
    env_file: ./app.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Pinned so a stale app.env cannot shadow the values baked into the
      # client bundle at build time, or silently diverge from them. app.env
      # must not carry the anon key at all (see app.env.example).
      NEXT_PUBLIC_SUPABASE_URL: http://api.herbally.app
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?run deploy/gen-keys.mjs first}
    volumes:
      # ISR / unstable_cache survive redeploys only if this is on a volume.
      # Do NOT mount /app/.next/server/app as well: Docker seeds it from the
      # old image and serves stale prerendered pages.
      - next-cache:/app/.next/cache
    depends_on:
      rest:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      # Runs inside the container: app publishes no ports, so a check from the
      # host has nothing to reach. busybox wget ships with node:*-alpine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    container_name: herbally-caddy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
      rest:
        condition: service_healthy
      auth:
        condition: service_healthy
    # Caddy serves plain HTTP behind Cloudflare Tunnel (edge → app, api → rest/auth)
    # and exposes api.herbally.app on the edge bridge for SSR/internal API calls.
    # Deliberately NOT on dbnet: a proxy compromise cannot reach db:5432.
    networks:
      edge:
        aliases:
          - api.herbally.app
          - herbally.app
      api:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: herbally-tunnel
    restart: unless-stopped
    # Named tunnel `herbally` (id d793ef5a-45ed-4c2d-8a3e-8db042cca1d9) instead
    # of a quick tunnel: the trycloudflare.com address is random and changes on
    # every restart, so it can never serve the real hostname. Ingress rules live
    # in deploy/cloudflared/config.yml, mounted read-only.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - caddy
    networks:
      - edge
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
  api:
  # No route off the host for the database.
  dbnet:
    internal: true

volumes:
  db-data:
  db-config:
  next-cache:
  caddy-data:
  caddy-config:
